services:
  postgres:
    image: postgres:16-alpine
    container_name: bench-dashboard-postgres
    environment:
      POSTGRES_DB: bench_dashboard
      POSTGRES_USER: bench_user
      POSTGRES_PASSWORD: bench_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench_user -d bench_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bench-dashboard-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://bench_user:bench_password@postgres:5432/bench_dashboard
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bench-dashboard-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres-data:
